<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Satish Kumar | Portfolio</title>
    <!--
      GitHub Pages has no server-side routing, so a direct visit to a route
      like /resume returns this 404 page. This redirects the browser back to
      the app's root with the intended path encoded in the query string; the
      matching script in index.html restores it via history.replaceState so
      React Router can pick up the correct route.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
